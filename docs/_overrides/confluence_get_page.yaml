example: |
  {"page_id": "12345678", "include_metadata": true}
tips: |
  Content is returned in Markdown format by default. Set `convert_to_markdown` to `false` to retrieve exact Confluence storage XHTML when macro preservation matters, including embedded Jira card-vs-list rendering, task metadata, and page layout details. Use `content_format: "atlas_doc_format"` on Confluence Cloud pages when you need ADF-native smart-link, datasource, or embedded Jira display metadata preserved for round-tripping. Use `include_metadata` for labels, version info, and last modified date.
